# Comment out `net.bind.ip` to bind to any IP address (will listen for connections on all interfaces).
# All times should be expressed in seconds.
# `debug.sso` directive is used to map a preconfigured sso ticket to a user with ID 1. Leave blank to disable.

output.enablelogfiles=1
output.verbositylevel=-1

performance.profiling.enabled=0
performance.sql.wait.warn.ms=100
performance.timer.warn.ms=100
performance.reward.warn.ms=250
performance.logwrite.warn.ms=100
performance.system.sample.seconds=30
performance.network.warn.bytes.per.sec=0
performance.serverstall.warn.ms=1000
performance.map.warn.ms=100
performance.cleanup.warn.ms=100

mysql.pool.min=5
mysql.pool.max=20
mysql.pool.lifetime=10
mysql.user=root
mysql.pass=
mysql.host=127.0.0.1
mysql.port=3306
mysql.dbname=andromeda

lang=en

net.backlog=20
net.bind.ip=127.0.0.1
net.bind.port=8080
